name: note_harbor_viewer
description: Note Harbor Viewer.
publish_to: "none"

version: 1.6.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  file_picker: ^13.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  screen_retriever: ^0.2.2
  sqlite3: ^3.3.2
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - web/icons/Icon-192.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
