[package]
name = "editor_server_rust"
version = "2.7.3"
edition = "2021"
description = "Note Harbor editor backend (Axum)"
license = "MIT"

[[bin]]
name = "editor_server_rust"
path = "src/main.rs"

[lib]
name = "editor_server_rust"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
chromiumoxide = { version = "0.9" }
futures = { version = "0.3" }
image = "0.25"
mime_guess = "2"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35", features = ["bundled"] }
regex = "1"
reqwest = { version = "0.13" }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
url = "2"
webp = "0.3"
zip = "2"

[dev-dependencies]
