[package]
name = "editor_desktop_tauri"
version = "2.24.4"
edition = "2021"
description = "Note Harbor editor desktop shell (Tauri)"
license = "MIT"

[[bin]]
name = "editor_desktop_tauri"
path = "src/main.rs"

[lib]
name = "editor_desktop_tauri"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
editor_server_rust = { path = "../../server-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
url = "2"

[target.'cfg(windows)'.dependencies]
# `IsZoomed` reads the window style, which Windows sets before the resize that
# raises tao's cached maximized flag; see `window_is_maximized` in main.rs.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
reqwest = { version = "0.13" }
tempfile = "3"
